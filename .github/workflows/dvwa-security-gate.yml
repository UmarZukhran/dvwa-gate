name: DVWA Security Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      security_level:
        description: "DVWA security level to test against"
        required: true
        default: "low"
        type: choice
        options: [low, medium, high, impossible]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build test matrix from registry.py
        id: build_matrix
        run: |
          MATRIX=$(python3 -c "import json; from registry import TESTS; print(json.dumps([t['id'] for t in TESTS]))")
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  security-tests:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let every test run to completion, don't cancel siblings on first red
      matrix:
        test_id: ${{ fromJson(needs.plan.outputs.matrix) }}

    services:
      dvwa:
        image: vulnerables/web-dvwa
        ports:
          - 8080:80

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Wait for DVWA to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/login.php > /dev/null; then
              echo "DVWA is up after ${i}s"; exit 0
            fi
            sleep 2
          done
          echo "::error::DVWA did not become ready in time"; exit 1

      - name: Initialize DVWA database
        run: |
          curl -s -c cookies.txt http://localhost:8080/setup.php -o setup_page.html
          TOKEN=$(grep -oP "name='user_token' value='\K[a-f0-9]+" setup_page.html)
          curl -s -b cookies.txt -X POST http://localhost:8080/setup.php \
            --data-urlencode "create_db=Create / Reset Database" \
            --data-urlencode "user_token=${TOKEN}" > /dev/null

      - name: Run ${{ matrix.test_id }} security regression test
        env:
          SECURITY_LEVEL: ${{ github.event.inputs.security_level || 'low' }}
        run: |
          python3 run_security_gate.py \
            --base-url http://localhost:8080 \
            --security-level "${SECURITY_LEVEL}" \
            --only "${{ matrix.test_id }}"

      - name: Upload ${{ matrix.test_id }} test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvwa-gate-evidence-${{ matrix.test_id }}
          path: "*.log"
          retention-days: 14
